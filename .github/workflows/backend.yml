name: Build & Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/**"
      - "backend/Dockerfile"
      - "backend/pom.xml"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend.yml"
      - ".dockerignore"
      - "frontend/app.json"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build + run all tests (unit + integration/Testcontainers) +
  # generate JaCoCo coverage report. This job must pass before anything
  # gets built into a Docker image or deployed.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest runners come with Docker pre-installed and running,
      # which is exactly what Testcontainers needs to spin up Postgres for
      # the integration tests - no extra setup needed here.
      - name: Run tests with coverage
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Publish JaCoCo coverage summary
        uses: madrapps/jacoco-report@v1.7.1
        if: always()
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload surefire/failsafe test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 2: Build Docker image, push to GHCR, deploy to EC2.
  # Only runs if the `test` job above succeeded.
  # ------------------------------------------------------------------
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/amanmakhija/splenza-backend:latest
            ghcr.io/amanmakhija/splenza-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reads expo.version straight out of the mobile app's app.json so
      # there's a single source of truth for "what's the latest version" -
      # nothing to remember to bump manually on the backend side anymore.
      # jq ships preinstalled on ubuntu-latest runners.
      - name: Extract app version from app.json
        id: app-version
        run: |
          VERSION=$(jq -r '.expo.version' frontend/app.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "::error::Could not read .expo.version from frontend/app.json"
            exit 1
          fi
          echo "Extracted app version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          envs: APP_VERSION
          script: |
            cd ~/splenza

            git fetch origin
            git reset --hard origin/main

            # .env already has an APP_LATEST_VERSION line - just swap its
            # value in place. Picked up by the backend container via
            # env_file: .env in docker-compose.prod.yml on the next
            # `up -d` below, no code change needed.
            sed -i "s/^APP_LATEST_VERSION=.*/APP_LATEST_VERSION=${APP_VERSION}/" .env

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
