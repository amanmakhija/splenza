name: Build Frontend

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  # ------------------------------------------------------------------
  # dev branch -> build a development-client APK locally on the runner.
  # For internal QA/testers to sideload; not submitted anywhere.
  # ------------------------------------------------------------------
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/**/*.gradle*', 'frontend/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Decode google-services.json
        working-directory: ./frontend
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "ERROR: secrets.GOOGLE_SERVICES_JSON is empty or not set" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > google-services-secret.json || {
            echo "ERROR: base64 decode failed" >&2
            exit 1
          }
          echo "Decoded google-services.json -> $(pwd)/google-services-secret.json (size: $(wc -c < google-services-secret.json) bytes)"

      - name: Verify google-services.json present
        working-directory: ./frontend
        run: |
          echo "Listing project root:"
          ls -la .
          echo "google-services-secret.json size: $(stat -c%s google-services-secret.json 2>/dev/null || echo 'MISSING')"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build development client locally
        working-directory: ./frontend
        # ─── CORE FIX: Pass the path variable directly to the EAS Execution command ───
        env:
          GOOGLE_SERVICES_FILE_PATH: "./google-services-secret.json"
        run: eas build --platform android --profile development --local --non-interactive --output=./build.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-apk
          path: frontend/build.apk
          retention-days: 14

      - name: Clean up secrets
        if: always()
        working-directory: ./frontend
        run: rm -f google-services-secret.json

  # ------------------------------------------------------------------
  # main branch -> build a production AAB locally on the runner.
  # Downloaded manually from the run's Artifacts section and uploaded
  # to Play Console by hand (no automated eas submit - personal Play
  # Console accounts don't currently have Play Developer API access).
  # ------------------------------------------------------------------
  build-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/**/*.gradle*', 'frontend/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Decode google-services.json
        working-directory: ./frontend
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "ERROR: secrets.GOOGLE_SERVICES_JSON is empty or not set" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > google-services.json || {
            echo "ERROR: base64 decode failed" >&2
            exit 1
          }
          echo "Decoded google-services.json -> $(pwd)/google-services.json (size: $(wc -c < google-services.json) bytes)"

      - name: Verify google-services.json present
        working-directory: ./frontend
        run: |
          echo "Listing project root:"
          ls -la .
          echo "google-services.json size: $(stat -c%s google-services.json 2>/dev/null || echo 'MISSING')"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production AAB locally
        working-directory: ./frontend
        run: eas build --platform android --profile production --local --non-interactive --output=./build.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-build-aab
          path: frontend/build.aab
          retention-days: 30

      - name: Clean up secrets
        if: always()
        working-directory: ./frontend
        run: rm -f google-services.json
