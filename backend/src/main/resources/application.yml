spring:
  application:
    name: splitwise-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

rate-limit:
  tiers:
    free:
      general: 60
      write: 20
      ai: 10
    pro:
      general: 300
      write: 120
      ai: 30

ai-credit:
  # Keyed by credit GROUP name (see FeatureCreditGroups), not by individual
  # feature - RECEIPT_SCAN and VOICE_EXPENSE currently share the "ai_assist"
  # group's single combined daily allowance, rather than each getting its
  # own. A future feature added to that same group automatically shares
  # this same limit with no config change; a feature deliberately left
  # ungrouped would need its own entry here keyed by its own feature name.
  free-daily-limits:
    ai_assist: ${AI_CREDIT_FREE_AI_ASSIST:2}
  packages:
    - id: pack_10
      credits: 10
      price-in-paise: 4900
      currency: INR
      google-play-product-id: ai_credits_10
    - id: pack_30
      credits: 30
      price-in-paise: 9900
      currency: INR
      badge: "Most popular"
      google-play-product-id: ai_credits_30
    - id: pack_100
      credits: 100
      price-in-paise: 24900
      currency: INR
      google-play-product-id: ai_credits_100

google-play:
  package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}
  service-account-credentials: ${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:}

rtdn:
  webhook-token: ${RTDN_WEBHOOK_TOKEN:}

ai:
  # Which vision provider ReceiptScanService uses - "anthropic" (default) or
  # "openai". Only that provider's client/properties beans get created (see
  # AnthropicVisionClient / OpenAiVisionClient's @ConditionalOnProperty) -
  # switching is a one-line env var change, no code/redeploy-logic change.
  provider: ${AI_PROVIDER:anthropic}
  anthropic:
    api-key: ${AI_API_KEY:}
    model: ${AI_ANTHROPIC_MODEL:claude-sonnet-4-6}
    base-url: ${AI_ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}
    max-tokens: ${AI_ANTHROPIC_MAX_TOKENS:1024}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-4o}
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
    max-tokens: ${AI_OPENAI_MAX_TOKENS:1024}
  # Speech-to-text for voice-expense entry - independently OpenAI-only for
  # now (not gated by ai.provider above, see WhisperProperties), defaults to
  # reusing OPENAI_API_KEY since that's the same account either way.
  whisper:
    api-key: ${WHISPER_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_WHISPER_MODEL:whisper-1}
    base-url: ${AI_WHISPER_BASE_URL:https://api.openai.com/v1/audio/transcriptions}

app:
  cors:
    allowed-origins:
      - https://getsplenza.in
      - https://www.getsplenza.in

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Splitwise-style expense splitting backend
