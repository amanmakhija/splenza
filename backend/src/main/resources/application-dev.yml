spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}

app:
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    max-file-size-bytes: 10485760
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: ${AWS_S3_ENDPOINT:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}
      access-key-id: ${AWS_S3_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY:}
  group:
    deleted-retention-days: ${GROUP_DELETED_RETENTION_DAYS:30}
  version-info:
    latest-version: ${APP_LATEST_VERSION:1.0.0}
    release-notes: ${APP_RELEASE_NOTES:}
  sms:
    provider: ${SMS_PROVIDER:noop}
    twofactor:
      api-key: ${TWOFACTOR_API_KEY:}
      template-name: ${TWOFACTOR_TEMPLATE_NAME:}
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  cors:
    allowed-origins:
      - http://localhost:3000

admin:
  broadcast:
    secret: ${ADMIN_BROADCAST_SECRET:}
    rate-limit-per-hour: ${ADMIN_BROADCAST_RATE_LIMIT_PER_HOUR:5}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

firebase:
  enabled: true
  credentials: ${FIREBASE_CREDENTIALS}

logging:
  level:
    root: INFO
    com.splitwise.app: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoint:
    health:
      show-details: always
