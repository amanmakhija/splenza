services:
  postgres:
    image: postgres:16-alpine
    container_name: splenza-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/amanmakhija/splenza-backend:${IMAGE_TAG:-latest}
    container_name: splenza-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}

      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}

      FIREBASE_ENABLED: "true"
      FIREBASE_CREDENTIALS: /run/secrets/firebase-admin.json

      # AI credits / receipt scanning
      AI_API_KEY: ${AI_API_KEY}

      # Google Play Billing purchase verification
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME}
      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: /run/secrets/google-play-billing.json

      # RTDN (Play refund/chargeback webhook) shared secret
      RTDN_WEBHOOK_TOKEN: ${RTDN_WEBHOOK_TOKEN}

    volumes:
      - ${FIREBASE_CREDENTIALS_HOST}:/run/secrets/firebase-admin.json:ro
      - ${GOOGLE_PLAY_CREDENTIALS_HOST}:/run/secrets/google-play-billing.json:ro

    ports:
      - "8080:8080"

volumes:
  postgres_data: